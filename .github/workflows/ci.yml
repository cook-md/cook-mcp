name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-22.04, macos-14] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check npm packages
        run: |
          node --check packaging/npm/install.js
          node --check packaging/npm/bin/cook-mcp.js
          node --check packaging/npm-shim/bin/nutrition-mcp.js
          (cd packaging/npm && npm pack --dry-run)
          (cd packaging/npm-shim && npm pack --dry-run)
      - name: Validate server.json (MCP Registry schema)
        run: |
          pip install --quiet jsonschema
          python3 - <<'EOF'
          import json, urllib.request, jsonschema
          d = json.load(open("server.json"))
          s = json.load(urllib.request.urlopen(d["$schema"]))
          jsonschema.Draft202012Validator(s).validate(d)
          print("server.json valid")
          EOF
      - name: Check versions agree
        run: |
          C="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)" \
                   "$(jq -r .version packaging/npm/package.json)" "$(jq -r .version packaging/npm-shim/package.json)" \
                   "$(jq -r '.dependencies["@cookmd/mcp"]' packaging/npm-shim/package.json)"; do
            [ "$v" = "$C" ] || { echo "version drift: $v != $C" >&2; exit 1; }
          done
          [ "$(jq -r .mcpName packaging/npm/package.json)" = "$(jq -r .name server.json)" ] || { echo "mcpName != server.json name" >&2; exit 1; }
